<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NowPageGen - Mourad.Soltani</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background: #0070f3; color: white; border: none; cursor: pointer; }
        #preview { margin-top: 30px; border: 1px solid #ccc; padding: 20px; min-height: 200px; }
        .sig { font-size: 0.8em; color: #666; margin-top: 40px; }
    </style>
</head>
<body>
    <h1>NowPageGen</h1>
    <p>Generate your personal /now page. <span class="sig">by Mourad.Soltani</span></p>
    <form id="nowForm" action="/generate" method="post" target="previewFrame">
        <label>Your Name</label>
        <input type="text" name="name" placeholder="Alex" required>
        <label>What I'm working on</label>
        <textarea name="working_on" rows="3" placeholder="Building a new micro-SaaS..."></textarea>
        <label>What I'm reading</label>
        <textarea name="reading" rows="2" placeholder="The Mom Test..."></textarea>
        <label>What I'm exploring</label>
        <textarea name="exploring" rows="2" placeholder="AI agents, indie hacking..."></textarea>
        <label>Quick note</label>
        <textarea name="note" rows="2" placeholder="Open to collaborations."></textarea>
        <button type="submit">Preview</button>
        <button type="button" onclick="downloadPage()">Download HTML</button>
    </form>
    <h2>Preview</h2>
    <iframe name="previewFrame" id="preview" style="width:100%; height:400px; border:1px solid #ddd;"></iframe>
    <script>
        function downloadPage() {
            const form = document.getElementById('nowForm');
            form.action = '/download';
            form.target = '_self';
            form.submit();
            form.action = '/generate';
            form.target = 'previewFrame';
        }
    </script>
</body>
</html>
